plugins {
    id 'com.android.application'
}

android {
    namespace      'com.zenkai.gtmobi'
    compileSdk     34

    defaultConfig {
        applicationId  'com.zenkai.gtmobi'
        minSdk         26
        targetSdk      34
        versionCode    1
        versionName    '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug { jniDebuggable true }
    }

    sourceSets {
        main { jniLibs.srcDirs = ['src/main/jniLibs'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Local-only Rust build — CI skips this with -x buildRustLib
task buildRustLib(type: Exec) {
    onlyIf {
        // skip if .so is already present (CI pre-builds it)
        !file("src/main/jniLibs/arm64-v8a/libgtm_app.so").exists()
    }
    workingDir rootProject.projectDir.parentFile
    def ndkHome = System.getenv('ANDROID_NDK_HOME') ?: ''
    environment 'ANDROID_NDK_HOME', ndkHome
    commandLine 'cargo', 'ndk',
        '-t', 'arm64-v8a',
        '-o', "${projectDir}/src/main/jniLibs",
        'build', '--release', '-p', 'gtm-app'
}

preBuild.dependsOn buildRustLib

dependencies {}
