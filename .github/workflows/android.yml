name: Build GTMobi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-gradle downloads Gradle automatically — no wrapper JAR needed in repo
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # nttld/setup-ndk is the reliable NDK installer — skips broken sdkmanager 'tools'
      - name: Install NDK r26b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Install Rust stable + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Build the .so first, separately — then tell Gradle to skip its own Rust task
      - name: Build Rust .so (arm64-v8a)
        run: |
          cargo ndk \
            -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build --release -p gtm-app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # -x buildRustLib skips the duplicate cargo-ndk call inside build.gradle
      - name: Assemble APK
        run: gradle -p android assembleRelease --no-daemon -x buildRustLib
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTMobi-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
