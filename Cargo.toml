[workspace]
resolver = "2"
members = [
    "crates/gtm-math",
    "crates/gtm-cull",
    "crates/gtm-vehicle",
    "crates/gtm-lighting",
    "crates/gtm-render",
    "crates/gtm-world",
    "crates/gtm-touch",
    "crates/gtm-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam     = "0.28"
bytemuck = { version = "1.14", features = ["derive"] }
log      = "0.4"
anyhow   = "1"
wgpu     = "22"
winit    = "0.30"
